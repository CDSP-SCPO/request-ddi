name: Lint
run-name: lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruff
        uses: astral-sh/ruff-action@v3
      
      - name: Lint backend
        run: |
          ruff check
          ruff format

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint frontend
        run: |
          cd js
          npm install
          npm run lint:check
