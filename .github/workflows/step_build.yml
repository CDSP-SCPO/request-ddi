name: Build
run-name: Build

on:
  workflow_call:
    secrets:
      login:
        required: true
      password:
        required: true
      repo:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: python -m pip install -U wheel build

      - name: Build package
        run: python -m build --sdist --wheel

  build-container-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t request-ddi:latest .

      - name: Get step vars
        id: vars
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "branch_name=$(echo ${GITHUB_REF##*/})" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "branch_name=$(echo $GITHUB_BASE_REF)" >> $GITHUB_OUTPUT
          else
            echo "branch_name=nightly" >> $GITHUB_OUTPUT
          fi

      - name: Push main branch and tagged image to DockerHub
        if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && contains(github.ref, 'refs/tags/'))
        env:
          DOCKERHUB_LOGIN: ${{ secrets.login }}
          DOCKERHUB_PAT: ${{ secrets.password }}
          DOCKERHUB_REPO_NAME: ${{ secrets.repo }}
        run: |
          echo $DOCKERHUB_PAT | docker login -u $DOCKERHUB_LOGIN --password-stdin
          docker build -t $DOCKERHUB_REPO_NAME:${{ steps.vars.outputs.branch_name }} .
          docker image ls
          docker push $DOCKERHUB_REPO_NAME:${{ steps.vars.outputs.branch_name }}

      - name: Push latest tagged image to DockerHub
        if: (github.event_name == 'push' && contains(github.ref, 'refs/tags/'))
        env:
          DOCKERHUB_LOGIN: ${{ secrets.login }}
          DOCKERHUB_PAT: ${{ secrets.password }}
          DOCKERHUB_REPO_NAME: ${{ secrets.repo }}
        run: |
          echo $DOCKERHUB_PAT | docker login -u $DOCKERHUB_LOGIN --password-stdin
          docker build -t $DOCKERHUB_REPO_NAME:latest .
          docker image ls
          docker push $DOCKERHUB_REPO_NAME:latest
