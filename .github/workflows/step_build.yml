name: Build
run-name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build package
        run: python -m build --sdist --wheel

  build-container-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t request-ddi:latest .

      - name: Get step vars
        id: vars
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "branch_name=$(echo ${GITHUB_REF##*/})" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "branch_name=$(echo $GITHUB_BASE_REF)" >> $GITHUB_OUTPUT
          else
            echo "branch_name=nightly" >> $GITHUB_OUTPUT
          fi

      - name: Push main branch and tagged image to DockerHub
        # if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && contains(github.ref, 'refs/tags/'))
        run: |
          echo ${{ secrets.DOCKERHUB_PAT }} | docker login -u ${{ secrets.DOCKERHUB_LOGIN }} --password-stdin ${{ secrets.DOCKERHUB_REGISTRY_NAME }}
          docker build -t request-ddi:${{ steps.vars.outputs.branch_name }} .
          # docker image push request-ddi:${{ steps.vars.outputs.branch_name }}
          docker image ls

      - name: Push latest tagged image to DockerHub
        # if: (github.event_name == 'push' && contains(github.ref, 'refs/tags/'))
        run: |
          echo ${{ secrets.DOCKERHUB_PAT }} | docker login -u ${{ secrets.DOCKERHUB_LOGIN }} --password-stdin ${{ secrets.DOCKERHUB_REGISTRY_NAME }}
          docker build -t request-ddi:latest .
          # docker image push request-ddi:latest
          docker image ls
